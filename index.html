<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIKOP-MBG — Koperasi Pemasok MBG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --ink:#1d2a22; --muted:#66756b; --line:#e2e8e2;
  --pri:#1f7a4a; --pri-2:#e6f2ea; --pri-ink:#fff;
  --warn:#b26a00; --warn-bg:#fff4e0; --bad:#b3261e; --bad-bg:#fdecea; --ok:#1f7a4a; --ok-bg:#e6f2ea; --info:#1b5e9a; --info-bg:#e7f0fa;
  --r:12px; --sh:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:28px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.logo{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}
/* Layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:#133b27;color:#dfeee5;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{padding:0 8px;color:#fff}aside .brand small{color:#9fc2ad}
aside .logo{background:#fff;color:#133b27}
.nav-sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8fb39e;margin:14px 10px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#dfeee5;text-decoration:none;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#fff;color:#133b27;font-weight:600}
.nav .ic{width:18px;text-align:center;opacity:.9}
main{min-width:0;padding:20px 24px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;flex:1;min-width:0}
.who{color:var(--muted);font-size:13px}
#menuBtn{display:none}
/* UI */
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#c8d3ca}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.bad{color:var(--bad);border-color:#f1c5c1}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.grid{display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12.5px}.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:140px;flex:1}
label.f.chk{flex-direction:row;align-items:center;color:var(--ink)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;color:var(--ink)}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe0cc;border-color:var(--pri)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:#f7faf7;font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:#f7faf7}
td input,td select{padding:5px 7px;min-width:80px}
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1ee;color:#44524a}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.bad{background:var(--bad-bg);color:var(--bad)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.info{background:var(--info-bg);color:var(--info)}
.alert{padding:10px 12px;border-radius:9px;margin-bottom:8px;font-size:13.5px}
.alert.warn{background:var(--warn-bg);color:#7a4900}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--muted)}.right{text-align:right}.mt{margin-top:12px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.flow span{font-size:12px;padding:3px 10px;border-radius:99px;background:#eef1ee;color:#6b776f}
.flow span.on{background:var(--pri);color:#fff}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,25,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow:auto;z-index:50}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mbox.lg{max-width:1000px}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:16px;margin:0;flex:1}
.mbody{padding:16px 18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.t{background:#1d2a22;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--sh);max-width:90vw}
.t.bad{background:var(--bad)}
#loading{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#8fd1a9,var(--pri));background-size:200% 100%;animation:ld 1s linear infinite;z-index:90}
@keyframes ld{to{background-position:-200% 0}}
.sum{display:flex;justify-content:space-between;padding:4px 0}.sum.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:16px}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:.2s;z-index:40}
  aside.open{transform:none}
  #menuBtn{display:inline-block}
  main{padding:14px 16px 60px}
  .two{grid-template-columns:1fr}
  .who{display:none}
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:16px}
  .mbox{max-width:100%}
}
@media print{aside,.top,.noprint{display:none!important}main{padding:0}}
</style>
</head>
<body>
<div id="loading" class="hidden"></div>

<!-- LOGIN -->
<section id="login">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="logo">KM</div><div><b>SIKOP-MBG</b><small>Sistem Koperasi Pemasok MBG</small></div></div>
    <label class="f">Username<input name="username" autocomplete="username" required></label>
    <label class="f mt">PIN (6 digit)<input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required></label>
    <button class="btn pri mt" style="width:100%">Masuk</button>
    <p class="muted" id="loginMsg" style="font-size:13px;min-height:20px"></p>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><div class="logo">KM</div><div><b id="kopName">SIKOP-MBG</b><small>Pemasok SPPG · MBG</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <div class="top">
      <button class="btn" id="menuBtn">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <span class="who" id="who"></span>
      <button class="btn sm" id="logoutBtn">Keluar</button>
    </div>
    <div id="page"></div>
  </main>
</div>

<div id="modal" class="hidden"></div>
<div id="toast"></div>

<script>
/* ======================== KONFIGURASI ======================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzRAJ5PdiTgmOJvjauyx8lOSZ3Xv2sB9ShLV0J5v5A_q35ywXtTyIV9frfjMFdPP0g8RQ/exec';   // URL Web App Apps Script (…/exec)

/* ======================== STATE & UTIL ======================== */
const S = { token: null, user: null, perms: [], settings: {}, anggota: [], sppg: [], komoditas: [], users: [] };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const x = Number(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : 0; };
const rp = v => 'Rp' + Math.round(num(v)).toLocaleString('id-ID');
const qf = v => num(v).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const tglID = s => { if (!s) return '-'; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const can = p => S.perms.includes('*') || S.perms.includes(p);
const byId = (arr, id) => arr.find(x => x.id === id) || {};
const agtName = id => byId(S.anggota, id).nama || '-';
const sppgName = id => byId(S.sppg, id).nama || '-';
const kom = id => byId(S.komoditas, id);
const statusBadge = s => {
  const m = { 'Baru': 'info', 'Dialokasikan': 'info', 'Diterima': 'warn', 'Dikirim': 'warn', 'Ditagih': 'warn', 'Lunas': 'ok', 'Batal': 'bad',
    'Belum Lunas': 'warn', 'Sebagian': 'warn', 'Aktif': 'ok', 'Nonaktif': 'bad', 'Keluar': 'bad', 'Rencana': 'info', 'Ditolak': 'bad',
    'Dalam Perjalanan': 'warn', 'Diterima SPPG': 'ok', 'YA': 'ok', 'TIDAK': 'bad' };
  return `<span class="b ${m[s] || ''}">${esc(s)}</span>`;
};

function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 't' + (bad ? ' bad' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 3000);
}
let loadingN = 0;
function loading(on) { loadingN += on ? 1 : -1; $('#loading').classList.toggle('hidden', loadingN <= 0); }

async function api(action, data = {}) {
  loading(true);
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, data }) });
    const j = await r.json();
    if (j.auth === false) { logout(true); throw new Error(j.error); }
    if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
    return j.data;
  } finally { loading(false); }
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
}

/* ---------- Modal ---------- */
function modal(title, body, { size = '', buttons = [] } = {}) {
  const m = $('#modal');
  m.innerHTML = `<div class="mbox ${size}"><div class="mhead"><h2>${esc(title)}</h2><button class="x" data-x>×</button></div>
    <div class="mbody">${body}</div>${buttons.length ? `<div class="mfoot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-b="${i}">${esc(b.label)}</button>`).join('')}</div>` : ''}</div>`;
  m.classList.remove('hidden');
  m.querySelector('[data-x]').onclick = closeModal;
  m.onclick = e => { if (e.target === m) closeModal(); };
  buttons.forEach((b, i) => {
    const el = m.querySelector(`[data-b="${i}"]`);
    el.onclick = async () => {
      if (!b.onClick) return closeModal();
      el.disabled = true;
      try { const keep = await b.onClick(m); if (keep !== true) closeModal(); } catch (e) { if (e && e.message) toast(e.message, true); } finally { el.disabled = false; }
    };
  });
  return m;
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
function formData(root) {
  const o = {};
  root.querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  return o;
}
const opt = (arr, val, lbl, sel, empty) => (empty !== undefined ? `<option value="">${esc(empty)}</option>` : '') +
  arr.map(x => { const v = typeof x === 'object' ? x[val] : x, l = typeof x === 'object' ? (typeof lbl === 'function' ? lbl(x) : x[lbl]) : x;
    return `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('');

function table(cols, rows, { foot, empty = 'Belum ada data' } = {}) {
  if (!rows.length) return `<div class="tbl-wrap"><div class="empty">${empty}</div></div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.num ? 'num' : ''}">${esc(c.h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r, i) => `<tr>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.f ? c.f(r, i) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody>
  ${foot ? `<tfoot><tr>${foot.map(x => `<td class="num">${x ?? ''}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
}

function downloadCSV(name, cols, rows) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.map(c => q(c.h)).join(';')].concat(rows.map(r => cols.map(c => q(c.csv ? c.csv(r) : r[c.k])).join(';'))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = name + '.csv'; a.click();
}

function printDoc(title, html) {
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
  body{font:13px/1.45 Arial,sans-serif;color:#111;padding:24px;max-width:820px;margin:auto}
  h2{margin:0}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{border:1px solid #999;padding:6px 8px;text-align:left}
  .num{text-align:right}.hd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}
  .sig{display:flex;justify-content:space-between;margin-top:40px}.sig div{text-align:center;width:40%}.sig p{margin-top:60px;border-top:1px solid #111;padding-top:4px}
  </style></head><body><div class="hd"><div><h2>${esc(S.settings.nama_koperasi)}</h2><div>${esc(S.settings.alamat_koperasi)}</div></div><div style="text-align:right"><h2>${esc(title)}</h2></div></div>
  ${html}<script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/* ======================== AUTH ======================== */
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const f = formData(e.target);
  $('#loginMsg').textContent = 'Memeriksa…';
  try {
    const r = await api('login', f);
    S.token = r.token;
    try { sessionStorage.setItem('sikop_token', r.token); } catch (_) {}
    await boot();
  } catch (err) { $('#loginMsg').textContent = err.message; }
};
function logout(silent) {
  if (!silent && S.token) api('logout').catch(() => {});
  S.token = null;
  try { sessionStorage.removeItem('sikop_token'); } catch (_) {}
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  if (silent) $('#loginMsg').textContent = 'Sesi berakhir, silakan login ulang.';
}
$('#logoutBtn').onclick = () => logout();
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');

async function reloadMaster() {
  const b = await api('bootstrap');
  Object.assign(S, { user: b.user, perms: b.perms, settings: b.settings, anggota: b.anggota, sppg: b.sppg, komoditas: b.komoditas, users: b.users || [] });
}
async function boot() {
  await reloadMaster();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#kopName').textContent = S.settings.nama_koperasi || 'SIKOP-MBG';
  $('#who').textContent = `${S.user.nama} · ${S.user.role}`;
  buildNav();
  go(location.hash.slice(1) || 'dashboard');
}

/* ======================== NAVIGASI ======================== */
const PAGES = [
  { sec: 'Ringkasan' },
  { id: 'dashboard', label: 'Dashboard', ic: '◎', perm: 'view' },
  { sec: 'Operasional MBG' },
  { id: 'po', label: 'Pesanan SPPG', ic: '▤', perm: 'view' },
  { id: 'terima', label: 'Penerimaan & QC', ic: '✓', perm: 'view' },
  { id: 'kirim', label: 'Pengiriman & BAST', ic: '➜', perm: 'view' },
  { sec: 'Keuangan' },
  { id: 'tagihan', label: 'Tagihan SPPG', ic: '₿', perm: 'view' },
  { id: 'bayar', label: 'Bayar Anggota', ic: '⇄', perm: 'view' },
  { id: 'kas', label: 'Kas', ic: '▥', perm: 'view' },
  { sec: 'Simpan Pinjam' },
  { id: 'simpanan', label: 'Simpanan', ic: '◈', perm: 'view' },
  { id: 'pinjaman', label: 'Pinjaman', ic: '◇', perm: 'view' },
  { sec: 'Analisis' },
  { id: 'laporan', label: 'Laporan & SHU', ic: '▦', perm: 'view' },
  { sec: 'Data Master' },
  { id: 'anggota', label: 'Anggota Pemasok', ic: '☺', perm: 'view' },
  { id: 'sppg', label: 'Mitra SPPG', ic: '⌂', perm: 'view' },
  { id: 'komoditas', label: 'Komoditas & Harga', ic: '❖', perm: 'view' },
  { id: 'setting', label: 'Pengaturan', ic: '⚙', perm: 'view' }
];
function buildNav() {
  $('#nav').innerHTML = PAGES.map(p => p.sec ? `<div class="nav-sec">${p.sec}</div>` :
    (can(p.perm) ? `<a data-p="${p.id}"><span class="ic">${p.ic}</span>${p.label}</a>` : '')).join('');
  $('#nav').querySelectorAll('a').forEach(a => a.onclick = () => go(a.dataset.p));
}
async function go(id) {
  const p = PAGES.find(x => x.id === id) || PAGES[1];
  location.hash = p.id;
  $('#nav').querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.p === p.id));
  $('#pageTitle').textContent = p.label;
  $('#side').classList.remove('open');
  $('#page').innerHTML = '<div class="empty">Memuat…</div>';
  try { await VIEWS[p.id](); } catch (e) { $('#page').innerHTML = `<div class="alert bad">${esc(e.message)}</div>`; }
}
const refresh = () => go(location.hash.slice(1));

/* ======================== VIEWS ======================== */
const VIEWS = {};

/* ---------- Dashboard ---------- */
VIEWS.dashboard = async () => {
  const d = await api('dashboard');
  const st = d.status_po;
  const flow = ['Baru', 'Dialokasikan', 'Diterima', 'Dikirim', 'Ditagih', 'Lunas'];
  const mPct = d.omzet_bulan ? (d.margin_bulan / d.omzet_bulan * 100).toFixed(1) : '0';
  const alerts = [
    ...d.harga_warning.map(w => `<div class="alert warn">⚠ Harga: ${esc(w)}</div>`),
    ...d.konsentrasi.filter(k => k.melebihi).map(k => `<div class="alert warn">⚠ Pasokan ${esc(k.komoditas)} 30 hari terakhir ${k.porsi_top}% dari satu pemasok (${esc(agtName(k.top_anggota_id))}). Tambah pemasok agar tidak bergantung pada satu anggota.</div>`),
    d.piutang_lewat > 0 ? `<div class="alert bad">Piutang SPPG lewat jatuh tempo: <b>${rp(d.piutang_lewat)}</b></div>` : '',
    d.hutang_lewat14 > 0 ? `<div class="alert bad">Pembayaran ke anggota tertunda &gt;14 hari: <b>${rp(d.hutang_lewat14)}</b> — prioritaskan agar tidak terjadi tunggakan ke pemasok.</div>` : ''
  ].join('');
  $('#page').innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="l">Omzet bulan ini</div><div class="v">${rp(d.omzet_bulan)}</div><div class="s">dari invoice SPPG</div></div>
    <div class="kpi ok"><div class="l">Margin kotor bulan ini</div><div class="v">${rp(d.margin_bulan)}</div><div class="s">${mPct}% dari omzet</div></div>
    <div class="kpi ${d.piutang_lewat > 0 ? 'bad' : ''}"><div class="l">Piutang SPPG</div><div class="v">${rp(d.piutang_total)}</div><div class="s">lewat tempo ${rp(d.piutang_lewat)}</div></div>

    <label class="f" style="max-width:220px">Status<select id="poSt">${opt(['Baru', 'Dialokasikan', 'Diterima', 'Dikirim', 'Ditagih', 'Lunas', 'Batal'], null, null, st, 'Semua')}</select></label>
    <div style="flex:1"></div>${can('pembelian') ? '<button class="btn pri" id="newPO">+ Pesanan baru</button>' : ''}
  </div></div>

function poForm() {
  const koms = S.komoditas.filter(k => k.aktif === 'YA');
  if (!S.sppg.length || !koms.length) return toast('Lengkapi data Mitra SPPG dan Komoditas terlebih dahulu.', true);
  const itemRow = () => `<tr><td><select name="k">${opt(koms, 'id', k => `${k.nama} (${k.satuan})`, '', 'Pilih komoditas')}</select></td>
    <td><input name="q" type="number" step="0.01" min="0"></td><td class="num" data-h>-</td><td class="num" data-s>-</td><td><button class="btn sm bad" data-del>×</button></td></tr>`;
  const m = modal('Pesanan SPPG baru', `
    <div class="row"><label class="f">Mitra SPPG<select name="sppg_id">${opt(S.sppg.filter(s => s.status === 'Aktif'), 'id', 'nama', '', 'Pilih SPPG')}</select></label>
    <label class="f">Tanggal kirim<input type="date" name="tgl_kirim" value="${today()}"></label></div>
    <div class="row mt"><label class="f">Sumber pesanan<select name="sumber">${opt(['Admin', 'WA', 'Impor', 'BGN'], null, null, 'Admin')}</select></label>
    <label class="f">No. referensi (opsional)<input name="ref_eksternal" placeholder="No. pesanan BGN / SPPG"></label></div>
    <label class="f mt">Catatan / menu<input name="catatan" placeholder="mis. Menu Senin: nasi, ayam, sayur bening"></label>
    <div class="tbl-wrap mt"><table><thead><tr><th>Komoditas</th><th>Qty</th><th class="num">Harga jual</th><th class="num">Subtotal</th><th></th></tr></thead>
    <tbody id="poItems">${itemRow()}</tbody><tfoot><tr><td colspan="3">Total</td><td class="num" id="poTot">Rp0</td><td></td></tr></tfoot></table></div>
    <button class="btn sm mt" id="addIt">+ Tambah item</button>`, {
    size: 'lg', buttons: [{ label: 'Batal' }, { label: 'Simpan pesanan', cls: 'pri', onClick: async mm => {
      const v = n => mm.querySelector(`[name=${n}]`).value;
      const f = { sppg_id: v('sppg_id'), tgl_kirim: v('tgl_kirim'), catatan: v('catatan'), sumber: v('sumber'), ref_eksternal: v('ref_eksternal') };
      f.items = [...mm.querySelectorAll('#poItems tr')].map(tr => ({ komoditas_id: tr.querySelector('[name=k]').value, qty: tr.querySelector('[name=q]').value })).filter(x => x.komoditas_id && num(x.qty) > 0);
      const id = await run(() => api('createPO', f), 'Pesanan tersimpan');
      refresh(); setTimeout(() => poDetail(id), 300);
    } }]
  });
  const recalc = () => {
    let t = 0;
    m.querySelectorAll('#poItems tr').forEach(tr => {
      const k = kom(tr.querySelector('[name=k]').value), q = num(tr.querySelector('[name=q]').value);
      tr.querySelector('[data-h]').textContent = k.id ? rp(k.harga_jual) : '-';
      const s = k.id ? q * num(k.harga_jual) : 0; t += s;
      tr.querySelector('[data-s]').textContent = rp(s);
    });
    m.querySelector('#poTot').textContent = rp(t);
  };
  const bind = () => m.querySelectorAll('#poItems tr').forEach(tr => {
    tr.oninput = recalc; tr.onchange = recalc;
    tr.querySelector('[data-del]').onclick = () => { tr.remove(); recalc(); };
  });
  m.querySelector('#addIt').onclick = () => { m.querySelector('#poItems').insertAdjacentHTML('beforeend', itemRow()); bind(); };
  bind();
}

async function poDetail(id) {
  const d = await run(() => api('getPO', { id }));
  const po = d.po;
  const editable = ['Baru', 'Dialokasikan'].includes(po.status) && can('pembelian');
  const flow = ['Baru', 'Dialokasikan', 'Diterima', 'Dikirim', 'Ditagih', 'Lunas'];
  const idx = flow.indexOf(po.status);
  const itemStats = d.items.map(it => {
    const al = d.alokasi.filter(a => a.po_item_id === it.id);
    return { ...it, alok: al.reduce((s, a) => s + num(a.qty_rencana), 0), terima: al.reduce((s, a) => s + num(a.qty_terima), 0), n: al.length };
  });
  const body = `
    <div class="flow">${flow.map((s, i) => `<span class="${i <= idx ? 'on' : ''}">${s}</span>`).join('')}${po.status === 'Batal' ? '<span class="on" style="background:var(--bad)">Batal</span>' : ''}</div>
    <div class="row"><div style="flex:1"><div class="muted">SPPG</div><b>${esc(sppgName(po.sppg_id))}</b></div>
    <div style="flex:1"><div class="muted">Tanggal kirim</div><b>${tglID(po.tgl_kirim)}</b></div>
    <div style="flex:1"><div class="muted">Nilai pesanan</div><b>${rp(po.total)}</b></div>
    <div style="flex:1"><div class="muted">Sumber</div>${sumberBadge(po)}</div></div>
    ${po.catatan ? `<p class="muted">${esc(po.catatan)}</p>` : ''}
    <h3 class="mt">Item pesanan</h3>
    ${table([{ h: 'Komoditas', f: r => esc(kom(r.komoditas_id).nama) }, { h: 'Pesan', num: 1, f: r => qf(r.qty) + ' ' + esc(kom(r.komoditas_id).satuan) },
      { h: 'Dialokasikan', num: 1, f: r => `${qf(r.alok)} <span class="muted">(${r.n} pemasok)</span>` + (r.alok + 1e-6 < num(r.qty) ? ' <span class="b warn">kurang</span>' : '') },
      { h: 'Diterima QC', num: 1, f: r => qf(r.terima) }, { h: 'Harga jual', num: 1, f: r => rp(r.harga_jual) }, { h: 'Subtotal', num: 1, f: r => rp(r.subtotal) }], itemStats)}
    <h3 class="mt">Alokasi ke anggota pemasok</h3>
    <div id="alokBox"></div>
    ${d.pengiriman.length ? `<h3 class="mt">Pengiriman</h3>` + table([{ h: 'No SJ', k: 'no_sj' }, { h: 'Tgl', f: r => tglID(r.tgl) }, { h: 'Driver', k: 'driver' }, { h: 'Status', f: r => statusBadge(r.status) }, { h: 'Penerima', k: 'penerima' }], d.pengiriman) : ''}
    ${d.invoice.length ? `<h3 class="mt">Invoice</h3>` + table([{ h: 'No', k: 'no_inv' }, { h: 'Total', num: 1, f: r => rp(r.total) }, { h: 'Dibayar', num: 1, f: r => rp(r.dibayar) }, { h: 'Status', f: r => statusBadge(r.status) }], d.invoice) : ''}`;
  const btns = [{ label: 'Tutup' }, { label: 'Cetak PO', onClick: () => { printPO(d); return true; } }];
  if (editable) btns.splice(1, 0, { label: 'Batalkan PO', cls: 'bad', onClick: async () => {
    const alasan = prompt('Alasan pembatalan?'); if (alasan === null) return true;
    await run(() => api('batalPO', { id: po.id, alasan }), 'PO dibatalkan'); refresh();
  } });
  if (po.status === 'Diterima' && can('gudang')) btns.push({ label: 'Kirim ke SPPG', cls: 'pri', onClick: () => { kirimForm(po); return true; } });
  if (po.status === 'Dikirim' && can('keuangan')) btns.push({ label: 'Buat invoice', cls: 'pri', onClick: async () => { await run(() => api('buatInvoice', { po_id: po.id }), 'Invoice dibuat'); refresh(); } });
  const m = modal(`Pesanan ${po.no_po}`, body, { size: 'lg', buttons: btns });
  renderAlokasi(m.querySelector('#alokBox'), d, editable);
}

function renderAlokasi(box, d, editable) {
  const items = d.items;
  let rows = d.alokasi.map(a => ({ ...a }));
  if (!editable) {
    box.innerHTML = table([{ h: 'Anggota', f: r => esc(agtName(r.anggota_id)) }, { h: 'Komoditas', f: r => esc(kom(r.komoditas_id).nama) },
      { h: 'Rencana', num: 1, f: r => qf(r.qty_rencana) }, { h: 'Diterima', num: 1, f: r => r.qty_terima === '' ? '-' : qf(r.qty_terima) },
      { h: 'Ditolak', num: 1, f: r => r.qty_tolak === '' ? '-' : qf(r.qty_tolak) }, { h: 'Grade', k: 'grade' }, { h: 'Harga beli', num: 1, f: r => rp(r.harga_beli) },
      { h: 'Status', f: r => statusBadge(r.status) + (r.bayar_id ? ' <span class="b ok">dibayar</span>' : '') }], rows, { empty: 'Belum ada alokasi' });
    return;
  }
  const draw = (warnings = []) => {
    const itemOpt = sel => opt(items, 'id', it => `${kom(it.komoditas_id).nama} (${qf(it.qty)} ${kom(it.komoditas_id).satuan})`, sel);
    const agtFor = (itemId, sel) => {
      const k = kom(byId(items, itemId).komoditas_id);
      const list = S.anggota.filter(a => a.status === 'Aktif');
      const match = list.filter(a => String(a.komoditas).split(',').includes(String(k.kode).toUpperCase()));
      const others = list.filter(a => !match.includes(a));
      return `<option value="">Pilih anggota</option><optgroup label="Pemasok ${esc(k.nama || '')}">${opt(match, 'id', a => `${a.nama} — ${a.desa || ''}`, sel)}</optgroup><optgroup label="Anggota lain">${opt(others, 'id', 'nama', sel)}</optgroup>`;
    };
    box.innerHTML = `${warnings.map(w => `<div class="alert warn">${esc(w)}</div>`).join('')}
      <div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Anggota</th><th>Qty rencana</th><th>Harga beli</th><th class="num">Nilai</th><th></th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr data-i="${i}"><td><select data-f="po_item_id">${itemOpt(r.po_item_id)}</select></td><td><select data-f="anggota_id">${agtFor(r.po_item_id, r.anggota_id)}</select></td>
      <td><input data-f="qty_rencana" type="number" step="0.01" value="${esc(r.qty_rencana)}"></td><td><input data-f="harga_beli" type="number" value="${esc(r.harga_beli)}"></td>
      <td class="num">${rp(num(r.qty_rencana) * num(r.harga_beli))}</td><td><button class="btn sm bad" data-del="${i}">×</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Belum ada alokasi — klik "Saran otomatis"</td></tr>'}
      </tbody></table></div>
      <div class="row mt"><button class="btn sm" id="sar">⚡ Saran otomatis</button><button class="btn sm" id="addA">+ Baris</button><div style="flex:1"></div><button class="btn sm pri" id="saveA">Simpan alokasi & kirim WA</button></div>
      <p class="muted" style="font-size:12.5px">Saran otomatis membagi pesanan ke beberapa anggota sesuai kapasitas, dengan porsi maksimal ${esc(S.settings.maks_porsi_pemasok_persen)}% per pemasok.</p>`;
    box.querySelectorAll('tr[data-i]').forEach(tr => {
      const r = rows[+tr.dataset.i];
      tr.querySelectorAll('[data-f]').forEach(el => el.onchange = () => {
        r[el.dataset.f] = el.value;
        if (el.dataset.f === 'po_item_id') { const it = byId(items, el.value); r.komoditas_id = it.komoditas_id; r.harga_beli = kom(it.komoditas_id).harga_beli; }
        draw(warnings);
      });
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); draw(warnings); });
    box.querySelector('#addA').onclick = () => { const it = items[0]; rows.push({ po_item_id: it.id, komoditas_id: it.komoditas_id, anggota_id: '', qty_rencana: '', harga_beli: kom(it.komoditas_id).harga_beli }); draw(warnings); };
    box.querySelector('#sar').onclick = async () => { const s = await run(() => api('saranAlokasi', { po_id: d.po.id })); rows = s.rows; draw(s.warnings); };
    box.querySelector('#saveA').onclick = async () => {
      if (rows.some(r => !r.anggota_id && num(r.qty_rencana) > 0)) return toast('Ada baris tanpa anggota.', true);
      await run(() => api('saveAlokasi', { po_id: d.po.id, rows }), 'Alokasi tersimpan'); closeModal(); refresh(); setTimeout(() => poDetail(d.po.id), 300);
    };
  };
  draw();
}

function printPO(d) {
  const po = d.po, s = byId(S.sppg, po.sppg_id);

  if ($('#pAdd')) $('#pAdd').onclick = () => {
    const m = modal('Pinjaman baru', `<label class="f">Anggota<select name="anggota_id">${opt(S.anggota.filter(a => a.status === 'Aktif'), 'id', a => `${a.no_anggota} — ${a.nama}`, '', 'Pilih')}</select></label>

      <label class="f mt">Keperluan<input name="ket" placeholder="mis. modal bibit cabai"></label><div class="alert info mt" id="sim">Isi pokok & tenor untuk simulasi.</div>`,

    m.querySelector('.mbody').oninput = () => {
      const f = formData(m); const pk = num(f.pokok), t = num(f.tenor), j = num(f.jasa_persen_bln);

    };
  };
};

    const f = formData(m); f.id = a.id; f.komoditas = [...m.querySelectorAll('[data-kk]')].filter(c => c.checked).map(c => c.dataset.kk).join(',');

  $('#logGo').onclick = async () => { const l = await run(() => api('listLog')); $('#logBox').innerHTML = table([{ h: 'Waktu', k: 'ts' }, { h: 'User', k: 'user' }, { h: 'Aksi', k: 'action' }, { h: 'Detail', k: 'detail' }], l); };
};

/* ---------- sessionStorage helper (aman bila diblokir) ---------- */
function sessionGet(k) { try { return sessionStorage.getItem('sikop_' + k); } catch (_) { return null; } }
function sessionSet(k, v) { try { sessionStorage.setItem('sikop_' + k, v); } catch (_) {} }

/* ---------- Auto login bila sesi masih ada ---------- */
(async () => {
  let t = null; try { t = sessionStorage.getItem('sikop_token'); } catch (_) {}
  if (t) { S.token = t; try { await boot(); } catch (_) { logout(true); $('#loginMsg').textContent = ''; } }
})();
window.addEventListener('hashchange', () => { if (S.token && S.user) { const id = location.hash.slice(1); const on = $('#nav a.on'); if (!on || on.dataset.p !== id) go(id); } });
</script>
